MEMORY {
    ZP:         start = $08,    size = $00f8, type = rw, file = "";
    SHORTRAM:   start = $0100,  size = $00c0, type = rw, file = "";
    STACK:      start = $01c0,  size = $0040, type = rw, file = "";
    OAM:        start = $0200,  size = $0100, type = rw, file = "";
    RAM:        start = $0300,  size = $0500, type = rw, file = "";
    WRAM:       start = $6000,  size = $2000, type = rw, file = "";
    HDR:        start = $0000,  size = $0010, type = ro, file = %O, fill = yes, fillval = $00;

    PRG_00:     start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $00, bank = 0;
    PRG_02:     start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $00, bank = 2;
    PRG_04:     start = $a000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00, bank = 4; # MakeCfg2000: free
    PRG_05:     start = $a000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00, bank = 4; # MakeCfg2000: free
    PRG_06:     start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $00, bank = 6; # MakeCfg4000: free
    PRG_08:     start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $00, bank = 8; # MakeCfg4000: free
    PRG_0a:     start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $00, bank = 10; # MakeCfg4000: free
    PRG_0c:     start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $00, bank = 12; # MakeCfg4000: free
    PRG_Last:   start = $c000, size = $4000, type = ro, file = %O, fill = yes, fillval = $00, bank = 14;

    CHR:        start = $0000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    INESHDR:    load = HDR,         type = ro;
    ZEROPAGE:   load = ZP,          type = zp;
    SHORTRAM:   load = SHORTRAM,    type = bss;
    STACK:      load = STACK,       type = bss;
    OAM:        load = OAM,         type = bss;
    BSS:        load = RAM,         type = bss;
    BSS_0700:   load = RAM,         type = bss, start = $0700;
    WRAM:       load = WRAM,        type = bss;

    GAME:       load = PRG_00,      type = ro;
    MUS_DRIVER: load = PRG_02,      type = ro;
    CODE:       load = PRG_Last,    type = ro;
    INIT:       load = PRG_Last,    type = ro, start = $FF50;

# MakeCfg: Insert here
    Vectors:    load = PRG_Last,    type = ro, start = $FFFA;
    CHR:        load = CHR,         type = ro;
}